<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="top-bar shadow">
    <div class="container top-content">
      <div class="logo">Market</div>
      <div class="menu-links">
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">About</a>
        <a href="#">Cart</a>
      </div>
      <div class="cart-box">
        <i class="fa-solid fa-cart-shopping"></i>
        <span>Cart</span>
      </div>
    </div>
  </div>
  <div class="container my-4">
    <div class="section-box shadow-sm">
      <h2 class="section-title">Fruits</h2>
      <hr>
      <div class="row g-4">
        <div class="col-md-6">
          <div class="card product-card text-center h-100">
            <img src="images/1.jpg" alt="Product 1" class="product-img">
            <div class="card-body">
              <h3 class="product-name">Product 1</h3>
              <h4 class="product-price">$4.99</h4>
              <button class="btn btn-primary add-btn">Add to Cart</button>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card product-card text-center h-100">
            <img src="images/2.jpg" alt="Product 2" class="product-img">
            <div class="card-body">
              <h3 class="product-name">Product 2</h3>
              <h4 class="product-price">$3.99</h4>
              <button class="btn btn-primary add-btn">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="section-box shadow-sm mt-4">
      <h2 class="section-title">Vegetable</h2>
      <hr>
      <div class="row g-4">
        <div class="col-md-6">
          <div class="card product-card text-center h-100">
            <img src="images/3.jpg" alt="Product 3" class="product-img">
            <div class="card-body">
              <h3 class="product-name">Product 3</h3>
              <h4 class="product-price">$1.99</h4>
              <button class="btn btn-primary add-btn">Add to Cart</button>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card product-card text-center h-100">
            <img src="images/4.jpg" alt="Product 4" class="product-img">
            <div class="card-body">
              <h3 class="product-name">Product 4</h3>
              <h4 class="product-price">$9.00</h4>
              <button class="btn btn-primary add-btn">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="section-box shadow-sm mt-4">
      <h2 class="section-title">Offers</h2>
      <hr>
      <div class="row g-4">
        <div class="col-md-6">
          <div class="card product-card text-center h-100">
            <img src="images/5.jpg" alt="Product 5" class="product-img">
            <div class="card-body">
              <h3 class="product-name">Product 5</h3>
              <div class="sale-price-box">
                <span class="old-price">$20.00</span>
                <span class="new-price">$15.00</span>
              </div>
              <button class="btn sale-btn add-btn">Add to Cart</button>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card product-card text-center h-100">
            <img src="images/6.jpg" alt="Product 6" class="product-img">
            <div class="card-body">
              <h3 class="product-name">Product 6</h3>
              <div class="sale-price-box">
                <span class="old-price">$35.00</span>
                <span class="new-price">$27.00</span>
              </div>
              <button class="btn sale-btn add-btn">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="footer-box">
    <div class="container footer-content">
      <span>© 2026 Market</span>
      <span>•</span>
      <span>Privacy Policy</span>
      <span>•</span>
      <span>Terms of Service</span>
    </div>
  </div>
</body>
</html>
